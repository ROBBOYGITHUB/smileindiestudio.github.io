<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Estudio de Videojuegos</title>
    <style>
        /* Estilos base al estilo Scott Games */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace; /* Fuente retro estilo terminal/misterio */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
            user-select: none; /* Evita arrastrar elementos accidentalmente */
        }

        /* Encabezado con el nombre del estudio */
        header {
            text-align: center;
            margin-top: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #cccccc;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        }

        /* Contenedor del Teaser principal */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            margin: 40px 0;
            width: 100%;
        }

        .teaser-container {
            max-width: 960px;
            width: 100%;
            text-align: center;
        }

        .teaser-container img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            /* Efecto sutil para resaltar la imagen en fondo negro */
            border: 1px solid #111111;
        }

        /* Pie de página minimalista */
        footer {
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #444444; /* Texto tenue */
            letter-spacing: 1px;
        }

        footer p {
            margin-bottom: 5px;
        }

        /* Enlaces discretos */
        footer a {
            color: #666666;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <!-- Cambia esto por el nombre de tu estudio -->
        <h1>TU ESTUDIO GAMES</h1>
    </header>

    <main>
        <section class="teaser-container">
            <!-- Coloca aquí la imagen de tu teaser actual -->
            <!-- Puedes reemplazar el src por la ruta de tu imagen, ej: "assets/teaser1.png" -->
            <img src="https://via.placeholder.com/960x540/050505/333333?text=PRÓXIMAMENTE" alt="Teaser del juego">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TU ESTUDIO. Todos los derechos reservados.</p>
        <p>Contacto: <a href="mailto:contacto@tuestudio.com">contacto@tuestudio.com</a></p>
    </footer>

</body>
</html>
